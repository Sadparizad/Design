name: Publish Design Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["design/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/hub/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: npm run snapshot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design/hub/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
